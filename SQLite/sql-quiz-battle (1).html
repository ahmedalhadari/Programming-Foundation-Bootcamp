<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL QUIZ BATTLE — Girls vs Boys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070b14;
    --panel:#0d1424;
    --panel-2:#111a2e;
    --line:#1e2c47;
    --pink:#ff4ec7;
    --pink-2:#ff7ad8;
    --cyan:#2bd9ff;
    --cyan-2:#5ee6ff;
    --green:#39ff8b;
    --yellow:#ffd23f;
    --orange:#ff8a3d;
    --purple:#9b6dff;
    --red:#ff5d5d;
    --text:#e8eefc;
    --dim:#7f90b3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'JetBrains Mono',monospace;
    background:
      radial-gradient(1100px 600px at 12% -8%, rgba(255,78,199,.16), transparent 60%),
      radial-gradient(1000px 600px at 92% -5%, rgba(43,217,255,.16), transparent 55%),
      radial-gradient(800px 500px at 50% 100%, rgba(155,109,255,.10), transparent 60%),
      var(--bg);
    color:var(--text);min-height:100%;padding:18px 22px 50px;overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
    background-size:42px 42px;
  }
  .wrap{position:relative;z-index:1;max-width:1500px;margin:0 auto}

  /* ============ HEADER ============ */
  .battle-title{text-align:center;margin:6px 0 22px}
  .battle-title h1{
    font-family:'Orbitron',sans-serif;font-weight:900;
    font-size:clamp(28px,5vw,60px);letter-spacing:5px;line-height:1;
    background:linear-gradient(90deg,var(--pink),var(--cyan));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 60px rgba(155,109,255,.25);
  }
  .battle-title .sub{color:var(--dim);font-size:13px;letter-spacing:2px;margin-top:6px}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* ============ TEAM PANELS ============ */
  .teams{
    display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:stretch;margin-bottom:24px;
  }
  .team{
    position:relative;border-radius:20px;padding:20px 26px;
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--line);
    display:flex;align-items:center;gap:18px;
    transition:transform .25s, box-shadow .25s;
    overflow:hidden;
  }
  .team::before{
    content:"";position:absolute;left:0;top:0;height:6px;width:100%;
    background:var(--c);box-shadow:0 0 24px var(--c);
  }
  .team::after{
    content:"";position:absolute;right:-50px;top:-50px;width:200px;height:200px;border-radius:50%;
    background:var(--c);opacity:.07;filter:blur(20px);
  }
  .team.lead{
    box-shadow:0 0 0 1px var(--c),0 14px 48px rgba(0,0,0,.5),0 0 80px -10px var(--c);
    transform:translateY(-2px);
  }
  .team-girls{--c:var(--pink)}
  .team-boys{--c:var(--cyan)}
  .team-emoji{
    font-size:54px;width:80px;height:80px;flex:none;display:grid;place-items:center;
    border-radius:16px;background:#0a1120;border:1px solid var(--line);
    box-shadow:inset 0 0 30px rgba(0,0,0,.4);
  }
  .team-info{flex:1}
  .team-name{
    font-family:'Orbitron',sans-serif;font-weight:900;font-size:22px;letter-spacing:3px;color:var(--c);
    text-shadow:0 0 18px var(--c);margin-bottom:4px;
  }
  .team-count{color:var(--dim);font-size:12px;letter-spacing:1px}
  .team-score{
    font-family:'Orbitron',sans-serif;font-weight:900;
    font-size:clamp(48px,6.5vw,80px);line-height:1;letter-spacing:1px;color:var(--c);
    text-shadow:0 0 30px var(--c);text-align:right;transition:transform .15s;min-width:120px;
  }
  .team-score.bump{transform:scale(1.22)}
  .vs{
    font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(28px,3.5vw,44px);
    color:var(--text);align-self:center;letter-spacing:3px;
    background:linear-gradient(180deg,var(--pink),var(--cyan));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    padding:0 6px;
  }
  @media(max-width:780px){
    .teams{grid-template-columns:1fr;gap:12px}
    .vs{transform:rotate(0);text-align:center}
    .team-score{min-width:0}
  }

  /* ============ BOARD ============ */
  .board-wrap{
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--line);border-radius:22px;padding:24px;
    box-shadow:0 18px 60px rgba(0,0,0,.45);
  }
  .board-head{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px;
  }
  .board-title{
    font-family:'Orbitron',sans-serif;font-weight:900;font-size:18px;letter-spacing:3px;
  }
  .board-title span{color:var(--green)}
  .controls{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    cursor:pointer;border:1px solid var(--line);background:#0a1120;color:var(--text);
    border-radius:10px;padding:8px 14px;font-family:'JetBrains Mono';font-size:12px;font-weight:700;
    letter-spacing:.5px;transition:.15s;
  }
  .chip:hover{border-color:var(--cyan);color:var(--cyan);transform:translateY(-1px)}
  .chip.warn{border-color:var(--orange);color:var(--orange)}
  .chip.warn:hover{background:rgba(255,138,61,.12)}

  .grid{
    display:grid;grid-template-columns:repeat(5,1fr);gap:10px;
  }
  @media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}

  .cat-head{
    grid-row:1;padding:14px 10px;border-radius:12px;text-align:center;
    background:linear-gradient(180deg,#0a1120,#0b1428);
    border:1px solid var(--line);
    font-family:'Orbitron',sans-serif;font-weight:700;font-size:11px;letter-spacing:1.5px;
    color:var(--c);text-shadow:0 0 14px var(--c);
    display:flex;flex-direction:column;align-items:center;gap:6px;
    border-top:3px solid var(--c);
  }
  .cat-head .ico{font-size:22px;filter:drop-shadow(0 0 8px var(--c))}

  .tile{
    cursor:pointer;border-radius:12px;padding:24px 8px;text-align:center;
    background:linear-gradient(180deg,#0c1730,#0a1228);
    border:1px solid var(--line);
    font-family:'Orbitron',sans-serif;font-weight:900;
    font-size:clamp(20px,3vw,36px);letter-spacing:1px;color:var(--c);
    text-shadow:0 0 20px var(--c);
    transition:transform .15s, box-shadow .2s, border-color .2s;
    position:relative;overflow:hidden;
  }
  .tile::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 50% 100%, var(--c), transparent 70%);
    opacity:.08;transition:opacity .25s;
  }
  .tile:hover{
    transform:translateY(-4px) scale(1.02);border-color:var(--c);
    box-shadow:0 14px 40px -10px var(--c);
  }
  .tile:hover::before{opacity:.18}
  .tile.used{
    cursor:default;color:#3a4a6e;text-shadow:none;border-color:#172040;
    background:#0a1020;
  }
  .tile.used::before{display:none}
  .tile.used::after{
    content:"✓";position:absolute;inset:0;display:grid;place-items:center;
    font-size:28px;color:#3a4a6e;font-weight:700;
  }
  .tile.used:hover{transform:none;box-shadow:none}

  /* ============ QUESTION OVERLAY ============ */
  .overlay{
    position:fixed;inset:0;z-index:40;display:none;
    background:rgba(4,7,14,.92);backdrop-filter:blur(6px);
    align-items:center;justify-content:center;padding:20px;
  }
  .overlay.show{display:flex;animation:fade .25s ease}
  @keyframes fade{from{opacity:0}}

  .qcard{
    width:min(960px,100%);max-height:92vh;overflow-y:auto;
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--c, var(--purple));border-radius:22px;
    padding:30px 36px;
    box-shadow:0 0 100px -20px var(--c, var(--purple)), 0 30px 80px rgba(0,0,0,.7);
    animation:popin .35s cubic-bezier(.2,1.3,.4,1);
  }
  @keyframes popin{from{transform:scale(.85);opacity:0}}

  .qhead{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
  .qcat{
    font-family:'Orbitron',sans-serif;font-weight:700;font-size:13px;letter-spacing:2px;
    color:var(--c);text-shadow:0 0 14px var(--c);
  }
  .qval{
    font-family:'Orbitron',sans-serif;font-weight:900;font-size:30px;letter-spacing:1px;
    color:var(--yellow);text-shadow:0 0 20px rgba(255,210,63,.4);
  }
  .qval small{font-size:14px;letter-spacing:1px;color:var(--dim);margin-left:6px}

  .timer-bar{
    height:6px;background:#0a1120;border-radius:99px;overflow:hidden;margin-bottom:22px;
    border:1px solid var(--line);
  }
  .timer-fill{
    height:100%;background:linear-gradient(90deg,var(--green),var(--yellow),var(--red));
    width:100%;transition:width 1s linear;
  }

  .question{
    font-size:clamp(18px,2.4vw,26px);line-height:1.5;font-weight:500;
    margin-bottom:18px;color:var(--text);
  }
  .question b{color:var(--cyan)}

  pre.code{
    background:#06101f;border:1px solid var(--line);border-radius:12px;
    padding:18px 20px;margin-bottom:22px;
    font-family:'JetBrains Mono',monospace;font-size:16px;line-height:1.55;
    color:#cdd8ef;overflow-x:auto;
    box-shadow:inset 0 0 30px rgba(0,0,0,.4);
  }
  pre.code .kw{color:var(--pink);font-weight:700}
  pre.code .str{color:var(--green)}
  pre.code .num{color:var(--yellow)}
  pre.code .fn{color:var(--cyan)}

  .options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
  @media(max-width:600px){.options{grid-template-columns:1fr}}
  .opt{
    cursor:pointer;display:flex;align-items:center;gap:14px;
    background:#0a1120;border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;transition:.15s;font-size:15px;text-align:left;
    color:var(--text);font-family:'JetBrains Mono';
  }
  .opt .letter{
    font-family:'Orbitron',sans-serif;font-weight:900;font-size:18px;
    width:34px;height:34px;display:grid;place-items:center;border-radius:8px;
    background:#0d1730;border:1px solid var(--line);color:var(--cyan);flex:none;
  }
  .opt:hover{border-color:var(--cyan);transform:translateX(4px)}
  .opt.right{border-color:var(--green);background:rgba(57,255,139,.10);box-shadow:0 0 30px -8px var(--green)}
  .opt.right .letter{color:var(--green);border-color:var(--green)}
  .opt.wrong{border-color:var(--red);background:rgba(255,93,93,.08);opacity:.7}
  .opt.wrong .letter{color:var(--red);border-color:var(--red)}
  .opt[disabled]{pointer-events:none}

  .reveal{
    display:none;margin-bottom:18px;padding:14px 18px;border-radius:12px;
    background:rgba(57,255,139,.07);border:1px solid rgba(57,255,139,.25);
    color:#cdedda;font-size:14px;line-height:1.5;
  }
  .reveal.show{display:block;animation:fade .3s ease}
  .reveal b{color:var(--green)}

  .award{display:none;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
  .award.show{display:flex}
  .award-btn{
    cursor:pointer;font-family:'Orbitron',sans-serif;font-weight:900;
    font-size:15px;letter-spacing:2px;padding:14px 22px;border-radius:12px;
    border:2px solid var(--bc);color:var(--bc);background:transparent;transition:.15s;
    text-shadow:0 0 16px var(--bc);
  }
  .award-btn:hover{background:var(--bc);color:#06121f;transform:translateY(-2px);box-shadow:0 8px 30px -6px var(--bc)}
  .award-btn.skip{--bc:var(--dim);text-shadow:none}
  .award-btn.girls{--bc:var(--pink)}
  .award-btn.boys{--bc:var(--cyan)}

  /* ============ WINNER ============ */
  .win-card{
    text-align:center;padding:40px 56px;border-radius:24px;
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:2px solid var(--c);box-shadow:0 0 100px -10px var(--c);
    animation:popin .45s cubic-bezier(.2,1.3,.4,1);max-width:600px;
  }
  .win-card .lbl{color:var(--dim);letter-spacing:4px;font-size:14px}
  .win-card .champ{
    font-family:'Orbitron';font-weight:900;font-size:clamp(38px,7vw,72px);
    color:var(--c);text-shadow:0 0 50px var(--c);margin:12px 0;letter-spacing:3px;
  }
  .win-card .vs-final{
    display:flex;justify-content:center;gap:20px;align-items:center;
    font-family:'Orbitron';font-size:24px;margin:20px 0;
  }
  .win-card .fs-girls{color:var(--pink)}
  .win-card .fs-boys{color:var(--cyan)}
  .win-card .close{margin-top:18px}

  canvas#fx{position:fixed;inset:0;z-index:60;pointer-events:none;display:none}
  canvas#fx.show{display:block}

  footer{margin-top:30px;text-align:center;color:var(--dim);font-size:12px;letter-spacing:.5px}
  footer kbd{
    background:#0a1120;border:1px solid var(--line);border-radius:5px;padding:2px 8px;
    font-family:'JetBrains Mono';font-size:11px;color:var(--cyan);
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="battle-title">
    <h1>SQL QUIZ BATTLE</h1>
    <div class="sub">// FOUNDATION BOOTCAMP · SQL SELECT · 20 QUESTIONS · GIRLS VS BOYS<span class="blink">_</span></div>
  </div>

  <!-- TEAM PANELS -->
  <div class="teams">
    <div class="team team-girls" id="teamG">
      <div class="team-emoji">👩‍💻</div>
      <div class="team-info">
        <div class="team-name">GIRLS</div>
        <div class="team-count">13 PLAYERS</div>
      </div>
      <div class="team-score" id="scoreG">0</div>
    </div>
    <div class="vs">VS</div>
    <div class="team team-boys" id="teamB">
      <div class="team-emoji">👨‍💻</div>
      <div class="team-info">
        <div class="team-name">BOYS</div>
        <div class="team-count">11 PLAYERS</div>
      </div>
      <div class="team-score" id="scoreB">0</div>
    </div>
  </div>

  <!-- GAME BOARD -->
  <div class="board-wrap">
    <div class="board-head">
      <div class="board-title">CHOOSE A <span>QUESTION</span></div>
      <div class="controls">
        <span class="chip" id="progress">0 / 20 answered</span>
        <button class="chip" onclick="declareWinner()">🏆 SHOW WINNER</button>
        <button class="chip warn" onclick="newGame()">↺ NEW GAME</button>
      </div>
    </div>
    <div class="grid" id="board"></div>
  </div>

  <footer>
    SHORTCUTS: <kbd>1-4</kbd> select answer A/B/C/D  ·  <kbd>G</kbd> award girls  ·  <kbd>B</kbd> award boys  ·  <kbd>ESC</kbd> close
  </footer>
</div>

<!-- QUESTION OVERLAY -->
<div class="overlay" id="qOverlay">
  <div class="qcard" id="qCard"></div>
</div>

<!-- WINNER OVERLAY -->
<div class="overlay" id="winOverlay">
  <div class="win-card" id="winCard"></div>
</div>

<canvas id="fx"></canvas>

<script>
/* ====================== QUESTIONS ====================== */
const CATS = [
  { name:'BASICS',         ico:'📋', color:'#39ff8b' },
  { name:'WHERE & FILTER', ico:'🔍', color:'#2bd9ff' },
  { name:'SORT & DISTINCT',ico:'🔢', color:'#ffd23f' },
  { name:'AGGREGATES',     ico:'📊', color:'#9b6dff' },
  { name:'GROUP BY',       ico:'🗂️', color:'#ff4ec7' }
];

// 5 categories × 4 questions (100, 200, 300, 400)
const QS = [
  // ----- BASICS -----
  { cat:0, val:100,
    q:'What does this query return?',
    code:'SELECT * FROM students;',
    opts:[
      'All rows AND all columns from the students table',
      'Only the first row of students',
      'Only the columns named *',
      'The number of students'
    ], a:0,
    why:'The asterisk * means "every column", and with no WHERE clause, every row is returned.'
  },
  { cat:0, val:200,
    q:'How do you select ONLY the name and age columns from students?',
    opts:[
      'SELECT name, age FROM students;',
      'SELECT (name, age) FROM students;',
      'FROM students SELECT name, age;',
      'GET name, age FROM students;'
    ], a:0,
    why:'You list the columns separated by commas after SELECT, and use FROM to name the table.'
  },
  { cat:0, val:300,
    q:'What does this query return?',
    code:'SELECT title FROM movies LIMIT 5;',
    opts:[
      'Only the first 5 columns',
      'The 5 oldest movies',
      'The first 5 movie titles',
      'Movies whose title equals 5'
    ], a:2,
    why:'LIMIT 5 returns at most 5 rows. Since we only selected title, only the title column appears.'
  },
  { cat:0, val:400,
    q:'What does the AS keyword do here?',
    code:'SELECT title AS movie_name FROM movies;',
    opts:[
      'Renames the table to movie_name',
      'Renames the title column to movie_name in the OUTPUT only',
      'Creates a new column in the table',
      'Filters where movie_name exists'
    ], a:1,
    why:'AS gives a column an alias in the output. The actual table column "title" stays the same.'
  },

  // ----- WHERE & FILTERING -----
  { cat:1, val:100,
    q:'Which clause filters which rows are returned?',
    opts:[
      'FROM',
      'WHERE',
      'ORDER BY',
      'HAVING'
    ], a:1,
    why:'WHERE decides which rows are kept. ORDER BY only sorts them, HAVING filters groups (not rows).'
  },
  { cat:1, val:200,
    q:'Which query correctly finds students whose city is Riyadh?',
    opts:[
      'SELECT * FROM students WHERE city == \'Riyadh\';',
      'SELECT * FROM students WHERE city = \'Riyadh\';',
      'SELECT * FROM students IF city = \'Riyadh\';',
      'SELECT * WHERE city = \'Riyadh\' FROM students;'
    ], a:1,
    why:'SQL uses a single = for equality (not == like other languages). Strings go in single quotes.'
  },
  { cat:1, val:300,
    q:'What does this query find?',
    code:"SELECT * FROM movies WHERE title LIKE 'The%';",
    opts:[
      'Movies whose title is exactly "The"',
      'Movies whose title contains "The" anywhere',
      'Movies whose title starts with "The"',
      'All movies'
    ], a:2,
    why:'The % wildcard matches anything. \'The%\' means: starts with "The" followed by anything.'
  },
  { cat:1, val:400,
    q:'What does this query find?',
    code:"SELECT * FROM students WHERE city IN ('Riyadh','Jeddah','Mecca');",
    opts:[
      'Students who live in ALL three cities at once',
      'Students who live in ANY of those three cities',
      'Students who live in NONE of those cities',
      'Error: IN can only take one value'
    ], a:1,
    why:'IN matches if the value equals ANY one of the listed values. It is a shortcut for many OR conditions.'
  },

  // ----- SORT, LIMIT, DISTINCT -----
  { cat:2, val:100,
    q:'Which clause sorts the results?',
    opts:[
      'SORT BY',
      'ARRANGE',
      'ORDER BY',
      'GROUP BY'
    ], a:2,
    why:'ORDER BY is SQL\'s sort clause. By default it sorts ascending (A-Z, smallest first).'
  },
  { cat:2, val:200,
    q:'What does DISTINCT do here?',
    code:'SELECT DISTINCT city FROM students;',
    opts:[
      'Returns each unique city only once (removes duplicates)',
      'Counts the cities',
      'Sorts the cities',
      'Returns only the most popular city'
    ], a:0,
    why:'DISTINCT removes duplicate values from the result. If 100 students live in Riyadh, Riyadh appears just once.'
  },
  { cat:2, val:300,
    q:'What does this query return?',
    code:'SELECT title FROM movies ORDER BY year DESC LIMIT 3;',
    opts:[
      'The 3 oldest movies',
      'The 3 newest movies',
      'The first 3 movies in the table',
      'Error: cannot use ORDER BY with LIMIT'
    ], a:1,
    why:'DESC = descending (largest year first = newest). LIMIT 3 takes the first 3 from that sorted list.'
  },
  { cat:2, val:400,
    q:'What does IS NULL find?',
    code:'SELECT * FROM students WHERE phone IS NULL;',
    opts:[
      'Students whose phone is the text "NULL"',
      'Students whose phone is the number 0',
      'Students whose phone is the empty string \'\'',
      'Students whose phone has no value (missing)'
    ], a:3,
    why:'NULL means missing/unknown — not 0 and not empty string. You MUST use IS NULL (not = NULL).'
  },

  // ----- AGGREGATES -----
  { cat:3, val:100,
    q:'Which function counts rows?',
    opts:[
      'NUMBER()',
      'COUNT()',
      'TOTAL()',
      'SIZE()'
    ], a:1,
    why:'COUNT() counts rows. COUNT(*) counts every row; COUNT(column) counts non-NULL values.'
  },
  { cat:3, val:200,
    q:'What does this query return?',
    code:'SELECT AVG(gpa) FROM students;',
    opts:[
      'The total (sum) of all GPAs',
      'The average GPA across all students',
      'The number of students',
      'The highest GPA'
    ], a:1,
    why:'AVG returns the arithmetic average — the sum of all values divided by the count.'
  },
  { cat:3, val:300,
    q:'What does this query return?',
    code:'SELECT MAX(price) FROM products;',
    opts:[
      'The smallest price',
      'The sum of all prices',
      'The largest single price',
      'The total number of products'
    ], a:2,
    why:'MAX returns the LARGEST value in a column. MIN does the opposite — the smallest.'
  },
  { cat:3, val:400,
    q:'What does this query return?',
    code:"SELECT SUM(amount) FROM sales WHERE city = 'Riyadh';",
    opts:[
      'The average sale amount in Riyadh',
      'The count of sales in Riyadh',
      'The total of all sale amounts from Riyadh only',
      'The biggest single sale in Riyadh'
    ], a:2,
    why:'WHERE filters rows BEFORE SUM runs. So only sales rows from Riyadh are added together.'
  },

  // ----- GROUP BY -----
  { cat:4, val:100,
    q:'Which clause groups rows by a column value?',
    opts:[
      'ORDER BY',
      'GROUP BY',
      'HAVING',
      'FROM'
    ], a:1,
    why:'GROUP BY collapses rows that share a value into one group. Often paired with COUNT, SUM, or AVG.'
  },
  { cat:4, val:200,
    q:'What does this query return?',
    code:'SELECT city, COUNT(*) FROM students GROUP BY city;',
    opts:[
      'The total number of students',
      'The number of students PER CITY',
      'A list of every student grouped by their city',
      'Error: COUNT(*) needs a WHERE'
    ], a:1,
    why:'GROUP BY city creates one row per city, and COUNT(*) tells you how many students are in each.'
  },
  { cat:4, val:300,
    q:'What does this query return?',
    code:'SELECT category, SUM(price) FROM products GROUP BY category;',
    opts:[
      'The total of all prices in the entire table',
      'The sum of prices for EACH category',
      'A list of every product with its price',
      'Error: cannot use SUM with GROUP BY'
    ], a:1,
    why:'GROUP BY category creates one row per category, and SUM(price) adds up the prices within each category.'
  },
  { cat:4, val:400,
    q:'What does this query return?',
    code:"SELECT city, AVG(gpa) FROM students\nWHERE age = 18\nGROUP BY city;",
    opts:[
      'The average GPA across all students',
      'The average GPA per city — but ONLY for students aged 18',
      'A list of all 18-year-old students',
      'The average GPA grouped by both age and city'
    ], a:1,
    why:'WHERE runs FIRST and keeps only 18-year-olds. Then GROUP BY city averages their GPAs per city.'
  }
];

/* ====================== STATE ====================== */
let scores = { g:0, b:0 };
let used   = new Set();
let current = null;
let answered = false;
let timer = null, timeLeft = 30, TIME_TOTAL = 30;

/* ====================== BOARD ====================== */
const board = document.getElementById('board');
function renderBoard(){
  let html='';
  // category headers (row 1)
  CATS.forEach((c,i)=>{
    html += `<div class="cat-head" style="--c:${c.color};grid-column:${i+1};grid-row:1">
      <div class="ico">${c.ico}</div><div>${c.name}</div></div>`;
  });
  // tiles by value (rows 2-5)
  [100,200,300,400].forEach((val,row)=>{
    CATS.forEach((c,col)=>{
      const idx = QS.findIndex(q=>q.cat===col && q.val===val);
      const isUsed = used.has(idx);
      html += `<div class="tile ${isUsed?'used':''}" style="--c:${c.color};grid-column:${col+1};grid-row:${row+2}"
        ${isUsed?'':`onclick="openQ(${idx})"`}>${isUsed?'':val}</div>`;
    });
  });
  board.innerHTML = html;
  document.getElementById('progress').textContent = `${used.size} / 20 answered`;
  if(used.size===20) setTimeout(declareWinner,400);
}

/* ====================== HIGHLIGHT SQL ====================== */
function highlight(code){
  // escape HTML
  let s = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // Stash highlighted spans behind placeholders so later regex passes
  // do not match inside the tags we generate.
  const tokens = [];
  const stash = (text) => {
    const ph = `\x00TK${tokens.length}TK\x00`;
    tokens.push(text);
    return ph;
  };

  // strings in single quotes (e.g. 'Riyadh')
  s = s.replace(/('[^']*')/g, m => stash(`<span class="str">${m}</span>`));
  // numbers
  s = s.replace(/\b(\d+\.?\d*)\b/g, m => stash(`<span class="num">${m}</span>`));
  // SQL keywords (case-insensitive)
  const kw=['SELECT','FROM','WHERE','ORDER','BY','GROUP','HAVING','LIMIT',
            'AS','DISTINCT','ASC','DESC','AND','OR','NOT','IN','BETWEEN',
            'LIKE','IS','NULL','OFFSET','UNION','ALL'];
  kw.forEach(k=>{
    const re = new RegExp(`\\b(${k})\\b`,'gi');
    s = s.replace(re, m => stash(`<span class="kw">${m}</span>`));
  });
  // aggregate / built-in functions
  ['COUNT','SUM','AVG','MIN','MAX','ROUND','UPPER','LOWER','LENGTH'].forEach(f=>{
    const re = new RegExp(`\\b(${f})\\b`,'gi');
    s = s.replace(re, m => stash(`<span class="fn">${m}</span>`));
  });

  // restore all stashed spans
  s = s.replace(/\x00TK(\d+)TK\x00/g, (_, i) => tokens[i]);
  return s;
}

/* ====================== QUESTION FLOW ====================== */
function openQ(idx){
  current = idx; answered=false;
  const q = QS[idx]; const c = CATS[q.cat];
  const card = document.getElementById('qCard');
  card.style.setProperty('--c', c.color);
  card.innerHTML = `
    <div class="qhead">
      <div class="qcat">${c.ico} ${c.name}</div>
      <div class="qval">${q.val}<small>pts</small></div>
    </div>
    <div class="timer-bar"><div class="timer-fill" id="tFill"></div></div>
    <div class="question">${q.q}</div>
    ${q.code ? `<pre class="code">${highlight(q.code)}</pre>` : ''}
    <div class="options" id="opts">
      ${q.opts.map((o,i)=>`
        <button class="opt" onclick="pickOpt(${i})">
          <span class="letter">${'ABCD'[i]}</span>
          <span>${o}</span>
        </button>`).join('')}
    </div>
    <div class="reveal" id="reveal"></div>
    <div class="award" id="award">
      <button class="award-btn girls" onclick="award('g')">👩‍💻 GIRLS GOT IT +${q.val}</button>
      <button class="award-btn skip" onclick="award(null)">SKIP / NO ONE</button>
      <button class="award-btn boys" onclick="award('b')">👨‍💻 BOYS GOT IT +${q.val}</button>
    </div>`;
  document.getElementById('qOverlay').classList.add('show');
  startTimer();
  beep(600);
}

function pickOpt(i){
  if(answered) return;
  answered = true;
  const q = QS[current];
  const opts = document.querySelectorAll('#opts .opt');
  opts.forEach((o,j)=>{
    o.disabled = true;
    if(j===q.a) o.classList.add('right');
    else if(j===i) o.classList.add('wrong');
  });
  const r = document.getElementById('reveal');
  const correct = i===q.a;
  r.innerHTML = `<b>${correct?'✓ CORRECT!':'✗ Correct answer: '+'ABCD'[q.a]}</b> — ${q.why}`;
  r.classList.add('show');
  document.getElementById('award').classList.add('show');
  stopTimer();
  beep(correct?900:300, .2);
}

function award(team){
  if(!answered){
    const q = QS[current];
    document.querySelectorAll('#opts .opt').forEach((o,j)=>{
      o.disabled=true; if(j===q.a) o.classList.add('right');
    });
    const r = document.getElementById('reveal');
    r.innerHTML = `<b>Correct answer: ${'ABCD'[q.a]}</b> — ${q.why}`;
    r.classList.add('show');
  }
  if(team){
    const q = QS[current];
    scores[team] += q.val;
    const el = document.getElementById(team==='g'?'scoreG':'scoreB');
    el.textContent = scores[team];
    el.classList.add('bump');
    setTimeout(()=>el.classList.remove('bump'),180);
    updateLead();
    beep(1100,.18); setTimeout(()=>beep(1400,.18),120);
  }
  used.add(current);
  setTimeout(closeQ, team?500:300);
}

function closeQ(){
  stopTimer();
  document.getElementById('qOverlay').classList.remove('show');
  current=null;
  renderBoard();
}

function updateLead(){
  const g = document.getElementById('teamG');
  const b = document.getElementById('teamB');
  g.classList.toggle('lead', scores.g>scores.b && scores.g>0);
  b.classList.toggle('lead', scores.b>scores.g && scores.b>0);
}

/* ====================== TIMER ====================== */
function startTimer(){
  timeLeft = TIME_TOTAL;
  const fill = document.getElementById('tFill');
  fill.style.width='100%';
  timer = setInterval(()=>{
    timeLeft--;
    fill.style.width = (timeLeft/TIME_TOTAL*100)+'%';
    if(timeLeft<=5 && timeLeft>0) beep(900);
    if(timeLeft<=0){ stopTimer(); beep(300,.4); if(!answered){ revealOnTimeout(); } }
  },1000);
}
function stopTimer(){ clearInterval(timer); timer=null; }
function revealOnTimeout(){
  answered=true;
  const q = QS[current];
  document.querySelectorAll('#opts .opt').forEach((o,j)=>{
    o.disabled=true; if(j===q.a) o.classList.add('right');
  });
  const r = document.getElementById('reveal');
  r.innerHTML = `<b>⏱ TIME UP — Correct answer: ${'ABCD'[q.a]}</b> — ${q.why}`;
  r.classList.add('show');
  document.getElementById('award').classList.add('show');
}

/* ====================== WINNER / END ====================== */
function declareWinner(){
  if(scores.g===0 && scores.b===0){ alert('Play some questions first!'); return; }
  const tie = scores.g===scores.b;
  const winner = scores.g>scores.b ? 'g' : 'b';
  const wName = tie?'TIE GAME!':(winner==='g'?'GIRLS WIN!':'BOYS WIN!');
  const wColor = tie?'#ffd23f':(winner==='g'?'#ff4ec7':'#2bd9ff');
  const card = document.getElementById('winCard');
  card.style.setProperty('--c', wColor);
  card.innerHTML = `
    <div class="lbl">★ ★ FINAL RESULT ★ ★</div>
    <div class="champ">${wName}</div>
    <div class="vs-final">
      <div><span class="fs-girls">👩‍💻 GIRLS</span><br><b style="font-size:32px">${scores.g}</b></div>
      <div style="color:var(--dim)">—</div>
      <div><span class="fs-boys">👨‍💻 BOYS</span><br><b style="font-size:32px">${scores.b}</b></div>
    </div>
    <button class="chip close" onclick="closeWin()">CLOSE</button>`;
  document.getElementById('winOverlay').classList.add('show');
  if(!tie) confetti(wColor);
  beep(700,.15); setTimeout(()=>beep(900,.15),140); setTimeout(()=>beep(1300,.3),300);
}
function closeWin(){ document.getElementById('winOverlay').classList.remove('show'); stopFx(); }

function newGame(){
  if(used.size>0 && !confirm('Reset scores and clear the board?')) return;
  scores={g:0,b:0}; used=new Set(); current=null;
  document.getElementById('scoreG').textContent='0';
  document.getElementById('scoreB').textContent='0';
  updateLead();
  renderBoard();
}

/* ====================== SOUND ====================== */
let ac;
function beep(freq=600,dur=.12){
  try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type='square';o.frequency.value=freq;o.connect(g);g.connect(ac.destination);
    g.gain.setValueAtTime(.05,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+dur);
    o.start();o.stop(ac.currentTime+dur);
  }catch(e){}
}

/* ====================== CONFETTI ====================== */
const cv=document.getElementById('fx'),cx=cv.getContext('2d');let parts=[],fxRun=false;
function confetti(mainColor){
  cv.classList.add('show');cv.width=innerWidth;cv.height=innerHeight;parts=[];
  const COLORS=[mainColor,'#39ff8b','#ffd23f','#9b6dff','#ff8a3d'];
  for(let i=0;i<200;i++)parts.push({
    x:Math.random()*cv.width,y:-20-Math.random()*cv.height,
    vx:(Math.random()-.5)*5,vy:2+Math.random()*5,
    s:5+Math.random()*8,c:COLORS[i%COLORS.length],
    r:Math.random()*6.28,vr:(Math.random()-.5)*.3
  });
  fxRun=true;loop();
}
function loop(){
  if(!fxRun)return;cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.r+=p.vr;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;
    cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore();});
  parts=parts.filter(p=>p.y<cv.height+30);
  if(parts.length)requestAnimationFrame(loop);else stopFx();
}
function stopFx(){fxRun=false;cv.classList.remove('show');cx.clearRect(0,0,cv.width,cv.height);}

/* ====================== KEYBOARD ====================== */
document.addEventListener('keydown', e=>{
  const qOpen = document.getElementById('qOverlay').classList.contains('show');
  const wOpen = document.getElementById('winOverlay').classList.contains('show');
  if(e.key==='Escape'){
    if(qOpen) closeQ();
    if(wOpen) closeWin();
    return;
  }
  if(qOpen){
    const n = parseInt(e.key);
    if(n>=1 && n<=4) pickOpt(n-1);
    if(e.key.toLowerCase()==='g') award('g');
    if(e.key.toLowerCase()==='b') award('b');
  }
});

/* ====================== INIT ====================== */
renderBoard();
</script>
